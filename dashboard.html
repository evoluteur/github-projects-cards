<!doctype html>
<html lang="en">
  <head>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-063933E3C2"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];

    <title>GitHub Projects Dashboard</title>
    <link
      rel="canonical"
      href="https://evoluteur.github.io/github-projects-cards/dashboard.html"
    />
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#bbdefb" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Overpass"
    />
    <link
      id="omg-theme-css"
      rel="stylesheet"
      href="css/themes/evol-blue/evol-blue.css"
    />
    <link href="css/me.css" rel="stylesheet" />
    <link href="css/code.css" rel="stylesheet" />
    <link href="css/charts.css" rel="stylesheet" />
    <script src="js/theme.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
    <script src="js/repos.js"></script>
    <script src="js/dashboard.js"></script>
    <meta
      name="keywords"
      content="github, projects, charts, stars, languages, repositories, statistics"
    />
    <meta
      name="description"
      content="Charts for GitHub repositories: projects by language, projects by stars, and projects created/updated over time."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Olivier Giulieri" />
  </head>

  <body onload="setupChartsPage()">
    <div class="nav">
      <span class="crumbs">
        <a id="navUserLink" href="https://evoluteur.github.io/">Evoluteur</a> >
        Code Projects :  GitHub -
        <a href="https://evoluteur.github.io/npm-pulse/"> npm</a>
      </span>
      </span>
      <div class="nav-right">
        <div id="omg-theme-picker"></div>
        <a
          class="github-link"
          href="https://github.com/evoluteur/github-projects-cards"
          target="_blank"
          rel="noopener"
          title="View on GitHub"
          aria-label="View on GitHub"
        >
          <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true">
            <path
              fill="currentColor"
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
        </a>
      </div>
    </div>

    <section class="gpc">
      <h1 id="chartsTitle">Loading...</h1>
      <span id="summary"></span>

      <div class="charts-grid">
        <div class="chart-card">
          <div class="chart-head">
            <h2>Projects by Language</h2>
            <span class="chart-toggle" id="toggleLanguage"></span>
          </div>
          <div class="chart-wrap">
            <div class="morph" id="chartLanguage"></div>
            <div class="chart-table" id="tableLanguage" hidden></div>
          </div>
        </div>

        <div class="chart-card">
          <div class="chart-head">
            <h2>Projects by Stars</h2>
            <span class="chart-toggle" id="toggleStars"></span>
          </div>
          <div class="chart-wrap">
            <div class="morph" id="chartStars"></div>
            <div class="chart-table" id="tableStars" hidden></div>
          </div>
        </div>

        <div class="chart-card wide">
          <div class="chart-head">
            <h2>Projects Created and Updated by Month</h2>
            <span class="chart-toggle" id="toggleActivity"></span>
          </div>
          <div class="chart-wrap">
            <canvas id="chartActivity"></canvas>
            <div class="chart-table" id="tableActivity" hidden></div>
          </div>
        </div>

        <div class="chart-card wide">
          <div class="chart-head">
            <h2>Projects Started and Last Updated</h2>
            <span class="chart-toggle" id="toggleTimeline"></span>
          </div>
          <div class="chart-wrap" id="wrapTimeline">
            <canvas id="chartTimeline"></canvas>
            <div class="chart-table" id="tableTimeline" hidden></div>
          </div>
        </div>
      </div>
    </section>

    <footer>
      <p>
        <a href="https://github.com/evoluteur/github-projects-cards"
          >GitHub-Projects-Cards</a
        >
        is open source at GitHub with MIT license.
      </p>

      &#169; 2026
      <a href="https://evoluteur.github.io/" target="_blank"
        >Olivier Giulieri</a
      >
    </footer>
  </body>
</html>
